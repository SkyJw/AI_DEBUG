[project]
name = "aidbg"
version = "0.1.0"
description = "Textual TUI multi-agent CLI over pydantic-ai v2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim[openai,mcp]>=1.0",
  "textual>=0.86",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
tracing = ["logfire>=2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-pyyaml>=6"]

[project.scripts]
aidbg = "aidbg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidbg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
