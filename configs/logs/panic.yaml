# panic (kernel dmesg) log — parsed by the `panic` LogFile class.
# It's the kernel dmesg stream (kernel init + SoC .ko logs), not a panic record.
type: panic
filenames: [panic]

target:
  # Ship OFF → every line kept, no annotation (lossless). Flip on for targeted mode.
  enabled: false
  entries:
    - id: panic-oops
      meaning: kernel oops / BUG / panic — a kernel-level fault
      match: regex
      pattern: "Unable to handle kernel|BUG:|Oops|Kernel panic"
      problem: kernel-oops
    - id: panic-call-trace
      meaning: kernel call trace / backtrace (continuation of a fault dump)
      match: regex
      pattern: "Call trace|Backtrace"
      problem: kernel-oops
    - id: panic-eth-link-down
      meaning: ethernet PHY link went down (carrier lost)
      match: regex
      pattern: "PHY link down|link down"
      problem: eth-link-flap
